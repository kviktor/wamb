{% load django_htmx static %}
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block title %}WAMB - Where Are My Books{% endblock %}</title>
        <link rel="apple-touch-icon" sizes="180x180" href="{% static "img/apple-touch-icon.png" %}">
        <link rel="icon" type="image/png" sizes="32x32" href="{% static "img/favicon-32x32.png" %}">
        <link rel="icon" type="image/png" sizes="16x16" href="{% static "img/favicon-16x16.png" %}">
        <link rel="manifest" href="{% static "manifest.json" %}">
        <link href="{% static "css/beer.min.css" %}" rel="stylesheet"/>
        <link href="{% static "css/style.css" %}" rel="stylesheet"/>
        <script type="module" src="{% static "js/beer.min.js" %}"></script>
        {% htmx_script %}
    </head>
    <body class="light" hx-headers='{"x-csrftoken": "{{ csrf_token }}"}'>
        {% block nav %}{% endblock %}
        <main class="responsive">{% block content %}{% endblock %}</main>
    </body>
</html>
