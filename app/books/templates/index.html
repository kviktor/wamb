{% extends "base.html" %}

{% block content %}
    <article class="no-padding">
        <div class="padding">
            <h1>welcome</h1>

            <p>
                We have {{ total_number_of_books }} books.
            </p>
            <p>
                Latest books:
                <ul>
                {% for book in latest_books %}
                    <li>
                        <a href="{% url "book-detail" pk=book.pk %}">
                            {{ book }}
                        </a>
                    </li>
                {% endfor %}
                </ul>
            </p>

        </div>
        </article>
{% endblock %}
